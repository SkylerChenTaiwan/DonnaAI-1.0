<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>DonnaAI</title>
  
  <!-- 防止無限重載的 meta 標籤 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  
  <!-- Icon 字體透過應用程式載入 -->
  
  <style>
    /* 防止 FOUC (Flash of Unstyled Content) */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      /* 修復滾動問題：移除 overflow: hidden */
    }
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    /* 緊急修復：強制覆蓋 NotionDatabaseV4.css 的破壞性規則 */
    .notion-database-wrapper {
      padding: 0 !important;
    }
    
    /* 只在 Notion 區域內才有 padding */
    .notion-table-container .notion-database-wrapper {
      padding: 0 96px !important;
    }
    
    /* 修復 ImportWizard Modal 尺寸 */
    .import-wizard,
    [data-testid="import-wizard"] {
      min-height: 85vh !important;
      width: 95% !important;
      max-width: 1200px !important;
      margin: 20px auto !important;
      background-color: white !important;
    }
    
    /* 修復 Modal 容器 */
    .modal-content {
      min-width: 90vw !important;
      min-height: 85vh !important;
      background-color: white !important;
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!-- Portal for Glide Data Grid overlay editor -->
  <div id="portal"></div>
</body>
</html>
