name: Adaptive Architecture Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每日自動執行
    - cron: '0 6 * * *'

env:
  NODE_VERSION: '18'
  REPORTS_RETENTION_DAYS: 30

jobs:
  # 快速檢查 (PR 觸發)
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quick validation
        run: |
          chmod +x tools/validation/run-validation.sh
          tools/validation/run-validation.sh --mode quick --ci --format json
        env:
          CI: true
          FAIL_ON_VISUAL_DIFF: false

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-validation-results
          path: reports/validation/
          retention-days: 7

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/validation/validation-report_*.json';
            
            // 找到最新的報告文件
            const glob = require('glob');
            const files = glob.sync(path);
            
            if (files.length === 0) {
              console.log('找不到驗證報告');
              return;
            }
            
            const reportFile = files[files.length - 1];
            const report = JSON.parse(fs.readFileSync(reportFile, 'utf8'));
            
            const statusEmoji = {
              excellent: '🎉',
              good: '✅', 
              warning: '⚠️',
              critical: '❌'
            };
            
            const body = `## ${statusEmoji[report.status]} Adaptive Architecture Validation
            
            **Overall Score:** ${report.overallScore}/100 (${report.status.toUpperCase()})
            
            ### Results Summary
            - **Architecture:** ${report.categories.architecture.score}/100 ${report.categories.architecture.status === 'pass' ? '✅' : '⚠️'}
            - **Design System:** ${report.categories.designSystem.score}/100 ${report.categories.designSystem.status === 'pass' ? '✅' : '⚠️'}
            - **Linting:** ${report.categories.linting.score}/100 ${report.categories.linting.status === 'pass' ? '✅' : '⚠️'}
            
            ### Key Metrics
            - Adaptive Compliance: ${report.summary.adaptiveCompliance.toFixed(1)}%
            - Design System Coverage: ${report.summary.designSystemCoverage.toFixed(1)}%
            - Quality Gate: ${report.summary.qualityGate === 'passed' ? '✅ Passed' : '❌ Failed'}
            
            ${report.recommendations.length > 0 ? `### Top Recommendations
            ${report.recommendations.slice(0, 3).map(rec => 
              `- **${rec.title}** (${rec.priority.toUpperCase()}): ${rec.description}`
            ).join('\n')}` : '🎉 No recommendations - excellent code quality!'}
            
            ---
            *Report generated by Adaptive Architecture Validation*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # 完整驗證 (主分支推送)
  full-validation:
    name: Full Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    
    strategy:
      matrix:
        validation-mode: ['architecture', 'design', 'migration', 'lint']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.validation-mode }} validation
        run: |
          chmod +x tools/validation/run-validation.sh
          tools/validation/run-validation.sh \
            --mode ${{ matrix.validation-mode }} \
            --ci \
            --format json \
            --output reports/validation/${{ matrix.validation-mode }}-validation.json
        env:
          CI: true

      - name: Upload ${{ matrix.validation-mode }} results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.validation-mode }}-validation-results
          path: reports/validation/${{ matrix.validation-mode }}-validation.json
          retention-days: ${{ env.REPORTS_RETENTION_DAYS }}

  # 視覺回歸測試 (獨立執行)
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'main')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build Storybook
        run: npm run build-storybook || echo "Skipping Storybook build"

      - name: Start Storybook
        run: |
          npm run storybook &
          sleep 30
        env:
          CI: true

      - name: Run visual tests
        run: |
          chmod +x tools/validation/run-validation.sh
          tools/validation/run-validation.sh \
            --mode full \
            --include-visual \
            --ci \
            --format html \
            --output reports/validation/visual-regression.html
        env:
          CI: true
          HEADLESS: true

      - name: Upload visual test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-results
          path: |
            reports/validation/
            tests/visual/results/
          retention-days: ${{ env.REPORTS_RETENTION_DAYS }}

  # 彙總報告
  generate-report:
    name: Generate Validation Report
    runs-on: ubuntu-latest
    needs: [full-validation]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all validation results
        uses: actions/download-artifact@v4
        with:
          path: validation-results/

      - name: Generate unified report
        run: |
          chmod +x tools/validation/run-validation.sh
          tools/validation/run-validation.sh \
            --mode full \
            --ci \
            --format html \
            --output reports/validation/unified-validation-report.html
        env:
          CI: true

      - name: Generate trend analysis
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            
            // 收集所有驗證結果
            const results = [];
            const resultsDir = 'validation-results';
            
            if (fs.existsSync(resultsDir)) {
              const dirs = fs.readdirSync(resultsDir);
              dirs.forEach(dir => {
                const dirPath = path.join(resultsDir, dir);
                if (fs.statSync(dirPath).isDirectory()) {
                  const files = fs.readdirSync(dirPath);
                  files.forEach(file => {
                    if (file.endsWith('.json')) {
                      try {
                        const content = fs.readFileSync(path.join(dirPath, file), 'utf8');
                        const data = JSON.parse(content);
                        results.push({ type: dir.replace('-validation-results', ''), data });
                      } catch (e) {
                        console.log('跳過無效檔案:', file);
                      }
                    }
                  });
                }
              });
            }
            
            // 生成趨勢分析
            const trend = {
              timestamp: new Date().toISOString(),
              commit: process.env.GITHUB_SHA,
              branch: process.env.GITHUB_REF_NAME,
              results: results,
              summary: {
                totalChecks: results.length,
                overallHealth: results.length > 0 ? 'good' : 'unknown'
              }
            };
            
            fs.writeFileSync('reports/validation/trend-analysis.json', JSON.stringify(trend, null, 2));
            console.log('趨勢分析已生成');
          "
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload unified report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-validation-report
          path: reports/validation/
          retention-days: ${{ env.REPORTS_RETENTION_DAYS }}

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/validation/
          destination_dir: validation-reports/${{ github.run_number }}

      # 通知 Slack (可選)
      - name: Notify Slack
        if: failure() && github.ref == 'refs/heads/main'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#dev-alerts'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow

  # 品質門檻檢查
  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download validation report
        uses: actions/download-artifact@v4
        with:
          name: unified-validation-report
          path: reports/validation/

      - name: Check quality gates
        run: |
          node -e "
            const fs = require('fs');
            const gates = JSON.parse(fs.readFileSync('tools/validation/quality-gates.json', 'utf8'));
            
            // 找到最新報告
            const reportFiles = fs.readdirSync('reports/validation/').filter(f => f.includes('unified') && f.endsWith('.json'));
            
            if (reportFiles.length === 0) {
              console.log('⚠️ 找不到驗證報告');
              process.exit(1);
            }
            
            const report = JSON.parse(fs.readFileSync('reports/validation/' + reportFiles[0], 'utf8'));
            
            const environment = process.env.GITHUB_REF === 'refs/heads/main' ? 'production' : 
                               process.env.GITHUB_REF === 'refs/heads/develop' ? 'staging' : 'development';
            
            const envGates = gates.profiles[environment] || gates;
            const overallThreshold = envGates.overallScore?.warning || gates.overallScore.warning.threshold;
            
            console.log('環境:', environment);
            console.log('總分:', report.overallScore);
            console.log('門檻:', overallThreshold);
            
            if (report.overallScore < overallThreshold) {
              console.log('❌ 品質門檻檢查失敗');
              console.log('修復建議:');
              report.recommendations?.slice(0, 3).forEach((rec, i) => {
                console.log((i + 1) + '. ' + rec.title + ' (' + rec.priority + ')');
              });
              process.exit(1);
            } else {
              console.log('✅ 品質門檻檢查通過');
            }
          "
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Set job summary
        run: |
          if [ -f "reports/validation/unified-validation-report.json" ]; then
            node -e "
              const report = JSON.parse(require('fs').readFileSync('reports/validation/unified-validation-report.json', 'utf8'));
              
              const summary = \`## 🔍 Validation Summary
              
              **Overall Score:** \${report.overallScore}/100 (\${report.status.toUpperCase()})
              
              **Quality Gate:** \${report.summary.qualityGate === 'passed' ? '✅ PASSED' : '❌ FAILED'}
              
              ### Category Scores
              \${Object.entries(report.categories).map(([cat, res]) => 
                \`- **\${cat}:** \${res.score}/100 \${res.status === 'pass' ? '✅' : res.status === 'warning' ? '⚠️' : '❌'}\`
              ).join('\n')}
              
              ### Key Metrics
              - Adaptive Compliance: \${report.summary.adaptiveCompliance.toFixed(1)}%
              - Design System Coverage: \${report.summary.designSystemCoverage.toFixed(1)}%
              - Migration Readiness: \${report.summary.migrationReadiness.toFixed(1)}%
              \`;
              
              require('fs').writeFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            "
          fi