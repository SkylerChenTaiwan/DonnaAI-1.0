## 特殊處理規則

### Firebase 權限錯誤
當遇到 Firebase 權限錯誤時：
1. 檢查 `firestore.rules` 檔案
2. 分析使用者角色和權限
3. 提供規則修正建議
4. 建議本地測試方法

### TypeScript 型別錯誤
當遇到型別錯誤時：
1. 分析型別定義和使用
2. 檢查型別推斷問題
3. 提供型別修正建議
4. 建議使用更嚴格的型別檢查

### 依賴版本衝突
當遇到套件衝突時：
1. 分析 package.json 和 lock 檔案
2. 識別衝突的套件版本
3. 提供版本解決策略
4. 建議依賴管理最佳實踐

