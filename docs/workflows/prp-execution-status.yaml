# 全域執行規則
execution_rules:
  # 強制檢查點
  mandatory_checkpoints:
    - checkpoint: "phase1_completion"
      rule: "所有 Phase 1 Agent 必須完成才能進入開發"
      enforcement: "blocking"
    - checkpoint: "phase5_completion"  
      rule: "所有 Phase 5 Agent 必須完成才能提交 Git"
      enforcement: "blocking"
    - checkpoint: "success_criteria_verification"
      rule: "所有 Success Criteria 必須驗證才能標記完成"
      enforcement: "blocking"
      
  # 自動觸發規則
  auto_triggers:
    - trigger: "ui_component_modification"
      agents: ["ui-visual-tester", "code-refactor-optimizer"]
      timing: "immediate"
    - trigger: "new_feature_completion"
      agents: ["interaction-tester", "typescript-type-guardian"]
      timing: "immediate"
    - trigger: "typescript_compilation_error"
      agents: ["typescript-type-guardian"]
      timing: "immediate"
      
  # 文件驗證規則
  document_validation:
    required_directories:
      - "/docs/specs"
      - "/docs/ux"
      - "/docs/types"
      - "/docs/risks"
      - "/docs/tests"
    naming_convention: "[prp-name]-[document-type].md"
    
# 恢復計劃
