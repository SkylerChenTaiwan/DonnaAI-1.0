<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 業務訓練</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F5F5F5;
            color: #000000;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 頁面切換 */
        .page {
            display: none;
            flex: 1;
            overflow: hidden;
        }
        
        .page.active {
            display: flex;
            flex-direction: column;
        }
        
        /* 客戶選擇頁面 */
        .persona-selection {
            padding: 16px;
            overflow-y: auto;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #000000;
        }
        
        .persona-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        
        .persona-card {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .persona-card:active {
            transform: scale(0.98);
        }
        
        .persona-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .persona-icon {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
        }
        
        .persona-info {
            flex: 1;
        }
        
        .persona-name {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 2px;
        }
        
        .persona-type {
            font-size: 12px;
            color: #8E8E93;
        }
        
        .persona-description {
            font-size: 14px;
            color: #3C3C43;
            line-height: 1.4;
        }
        
        /* 對話頁面 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #FFFFFF;
        }
        
        .chat-header {
            background: #F9F9F9;
            padding: 12px 16px;
            border-bottom: 1px solid #E5E5EA;
        }
        
        .customer-info {
            display: flex;
            align-items: center;
        }
        
        .customer-avatar {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 12px;
        }
        
        .customer-details {
            flex: 1;
        }
        
        .customer-name {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
        }
        
        .customer-state {
            font-size: 12px;
            color: #8E8E93;
        }
        
        .end-button {
            padding: 6px 12px;
            background: #FF3B30;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        
        /* 指標顯示 */
        .metrics-bar {
            background: #F2F2F7;
            padding: 12px 16px;
            border-bottom: 1px solid #E5E5EA;
            display: flex;
            gap: 16px;
        }
        
        .metric-item {
            flex: 1;
            text-align: center;
        }
        
        .metric-label {
            font-size: 12px;
            color: #8E8E93;
            margin-bottom: 4px;
        }
        
        .metric-value {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
        }
        
        .metric-bar {
            height: 4px;
            background: #E5E5EA;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        
        .metric-fill {
            height: 100%;
            background: #34C759;
            transition: width 0.3s;
        }
        
        /* 對話區域 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #FFFFFF;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-end;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .message.customer .message-bubble {
            background: #F2F2F7;
            color: #000000;
            border-bottom-left-radius: 4px;
        }
        
        .message.user .message-bubble {
            background: #007AFF;
            color: #FFFFFF;
            border-bottom-right-radius: 4px;
        }
        
        .message-time {
            font-size: 11px;
            color: #8E8E93;
            margin: 0 8px;
        }
        
        /* 提示訊息 */
        .hint-message {
            background: #FFF3CD;
            border: 1px solid #FFE69C;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #664D03;
        }
        
        .hint-label {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        /* 輸入區域 */
        .input-container {
            background: #F9F9F9;
            border-top: 1px solid #E5E5EA;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .input-wrapper {
            flex: 1;
            background: #FFFFFF;
            border: 1px solid #E5E5EA;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
        }
        
        .message-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            resize: none;
            max-height: 100px;
            line-height: 1.4;
        }
        
        .send-button {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: #007AFF;
            color: #FFFFFF;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .send-button:disabled {
            background: #C7C7CC;
            cursor: not-allowed;
        }
        
        .send-button:active:not(:disabled) {
            background: #0051D5;
        }
        
        /* 載入動畫 */
        .loading {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #E5E5EA;
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 狀態變化提示 */
        .state-change-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000;
            color: #FFFFFF;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        
        .state-change-toast.show {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 客戶選擇頁面 -->
        <div id="personaSelectionPage" class="page active">
            <div class="persona-selection">
                <h2 class="section-title">選擇訓練對象</h2>
                <div id="personaGrid" class="persona-grid">
                    <!-- 動態載入客戶原型 -->
                </div>
            </div>
        </div>
        
        <!-- 對話頁面 -->
        <div id="chatPage" class="page">
            <div class="chat-container">
                <!-- 客戶資訊標題 -->
                <div class="chat-header">
                    <div class="customer-info">
                        <div id="customerAvatar" class="customer-avatar"></div>
                        <div class="customer-details">
                            <div id="customerName" class="customer-name"></div>
                            <div id="customerState" class="customer-state"></div>
                        </div>
                        <button class="end-button" onclick="endSession()">結束訓練</button>
                    </div>
                </div>
                
                <!-- 效能指標 -->
                <div class="metrics-bar">
                    <div class="metric-item">
                        <div class="metric-label">信任度</div>
                        <div id="trustValue" class="metric-value">5</div>
                        <div class="metric-bar">
                            <div id="trustBar" class="metric-fill" style="width: 50%"></div>
                        </div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">興趣度</div>
                        <div id="interestValue" class="metric-value">5</div>
                        <div class="metric-bar">
                            <div id="interestBar" class="metric-fill" style="width: 50%"></div>
                        </div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">對話輪數</div>
                        <div id="turnCount" class="metric-value">0</div>
                    </div>
                </div>
                
                <!-- 對話訊息區域 -->
                <div id="messagesContainer" class="messages-container"></div>
                
                <!-- 輸入區域 -->
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea 
                            id="messageInput" 
                            class="message-input" 
                            placeholder="輸入訊息..." 
                            rows="1"
                        ></textarea>
                    </div>
                    <button id="sendButton" class="send-button" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M3 20V4L22 12L3 20V4ZM5 17L16.85 12L5 7V10.5L11 12L5 13.5V17Z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 狀態變化提示 -->
    <div id="stateChangeToast" class="state-change-toast"></div>
    
    <script>
        // 全域狀態管理
        let state = {
            sessionActive: false,
            currentPersona: null,
            messages: [],
            metrics: { trust: 5, interest: 5, turnCount: 0 },
            pendingCallbacks: new Map()
        };
        
        // 客戶原型資料（暫時硬編碼，實際應從後端載入）
        const customerPersonas = [
            {
                id: 'cautious-sme-owner',
                name: '謹慎型中小企業主',
                icon: '🏢',
                color: '#FF9500',
                description: '經營傳統產業，對新技術持保留態度，重視投資報酬率',
                type: '中小企業'
            },
            {
                id: 'tech-savvy-manager',
                name: '科技導向經理人',
                icon: '💻',
                color: '#007AFF',
                description: '熟悉科技產品，追求創新，但預算有限',
                type: '科技業'
            },
            {
                id: 'relationship-buyer',
                name: '關係型採購主管',
                icon: '🤝',
                color: '#34C759',
                description: '重視長期合作關係，決策謹慎，需要建立信任',
                type: '製造業'
            },
            {
                id: 'price-sensitive-retailer',
                name: '價格敏感零售商',
                icon: '🏪',
                color: '#FF3B30',
                description: '極度重視價格，經常比價，利潤微薄',
                type: '零售業'
            },
            {
                id: 'busy-executive',
                name: '忙碌高階主管',
                icon: '⏱️',
                color: '#5856D6',
                description: '時間寶貴，要求效率，只關注核心價值',
                type: '大型企業'
            }
        ];
        
        // 初始化
        window.onDonnaAIReady = function() {
            console.log('AI RolePlay WebApp 已就緒');
            loadPersonas();
        };
        
        // 生成回調 ID
        function generateCallbackId() {
            return `callback_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        }
        
        // 載入客戶原型
        function loadPersonas() {
            const grid = document.getElementById('personaGrid');
            
            // 暫時使用硬編碼資料，實際應透過 Native Bridge 載入
            customerPersonas.forEach(persona => {
                const card = createPersonaCard(persona);
                grid.appendChild(card);
            });
        }
        
        // 建立客戶原型卡片
        function createPersonaCard(persona) {
            const card = document.createElement('div');
            card.className = 'persona-card';
            card.onclick = () => startSession(persona.id);
            
            card.innerHTML = `
                <div class="persona-header">
                    <div class="persona-icon" style="background-color: ${persona.color}20;">
                        ${persona.icon}
                    </div>
                    <div class="persona-info">
                        <div class="persona-name">${persona.name}</div>
                        <div class="persona-type">${persona.type}</div>
                    </div>
                </div>
                <div class="persona-description">${persona.description}</div>
            `;
            
            return card;
        }
        
        // 開始訓練會話
        function startSession(personaId) {
            const persona = customerPersonas.find(p => p.id === personaId);
            if (!persona) return;
            
            state.currentPersona = persona;
            state.sessionActive = true;
            state.messages = [];
            state.metrics = { trust: 5, interest: 5, turnCount: 0 };
            
            // 更新 UI
            updateCustomerInfo(persona);
            showPage('chatPage');
            
            // 透過 Native Bridge 開始會話
            const callbackId = generateCallbackId();
            state.pendingCallbacks.set(callbackId, (data) => {
                if (data.greeting) {
                    addMessage('customer', data.greeting);
                }
            });
            
            if (window.DonnaAI) {
                window.DonnaAI.sendMessage('roleplay', {
                    action: 'startSession',
                    data: { personaId },
                    callbackId
                });
            } else {
                // 開發模式模擬
                setTimeout(() => {
                    addMessage('customer', '您好，我聽說您們有新的解決方案？不過我得先說，我們目前的系統運作得還不錯。');
                }, 500);
            }
        }
        
        // 更新客戶資訊顯示
        function updateCustomerInfo(persona) {
            document.getElementById('customerAvatar').style.backgroundColor = persona.color + '20';
            document.getElementById('customerAvatar').textContent = persona.icon;
            document.getElementById('customerName').textContent = persona.name;
            document.getElementById('customerState').textContent = '狀態：初次接觸';
        }
        
        // 切換頁面
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }
        
        // 新增訊息到對話
        function addMessage(sender, content, hint) {
            const container = document.getElementById('messagesContainer');
            const messageId = `msg_${Date.now()}`;
            
            // 如果有提示，先顯示提示
            if (hint) {
                const hintDiv = document.createElement('div');
                hintDiv.className = 'hint-message';
                hintDiv.innerHTML = `
                    <div class="hint-label">💡 提示</div>
                    <div>${hint}</div>
                `;
                container.appendChild(hintDiv);
            }
            
            // 建立訊息元素
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.id = messageId;
            
            const time = new Date().toLocaleTimeString('zh-TW', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageDiv.innerHTML = `
                <span class="message-time">${time}</span>
                <div class="message-bubble">${content}</div>
            `;
            
            container.appendChild(messageDiv);
            
            // 儲存到狀態
            state.messages.push({
                id: messageId,
                sender,
                content,
                timestamp: new Date(),
                hint
            });
            
            // 捲動到底部
            container.scrollTop = container.scrollHeight;
        }
        
        // 發送訊息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !state.sessionActive) return;
            
            // 清空輸入框
            input.value = '';
            input.style.height = 'auto';
            
            // 顯示用戶訊息
            addMessage('user', content);
            
            // 顯示載入中
            showLoading(true);
            
            // 透過 Native Bridge 發送
            const callbackId = generateCallbackId();
            state.pendingCallbacks.set(callbackId, (data) => {
                showLoading(false);
                
                if (data.response) {
                    addMessage('customer', data.response, data.hint);
                }
                
                if (data.metrics) {
                    updateMetrics(data.metrics);
                }
                
                if (data.stateChange) {
                    showStateChange(data.stateChange);
                }
            });
            
            if (window.DonnaAI) {
                window.DonnaAI.sendMessage('roleplay', {
                    action: 'sendMessage',
                    data: { content },
                    callbackId
                });
            } else {
                // 開發模式模擬
                setTimeout(() => {
                    showLoading(false);
                    const responses = [
                        '這聽起來很有趣，但我需要更多細節。',
                        '我們之前試過類似的方案，但效果不太理想。',
                        '價格是我們主要的考量因素。',
                        '能否提供一些成功案例？'
                    ];
                    const response = responses[Math.floor(Math.random() * responses.length)];
                    addMessage('customer', response);
                    
                    // 模擬指標更新
                    const newMetrics = {
                        trust: Math.min(10, state.metrics.trust + (Math.random() > 0.5 ? 1 : 0)),
                        interest: Math.min(10, state.metrics.interest + (Math.random() > 0.5 ? 1 : -1)),
                        turnCount: state.metrics.turnCount + 1
                    };
                    updateMetrics(newMetrics);
                }, 1000);
            }
        }
        
        // 顯示/隱藏載入動畫
        function showLoading(show) {
            const container = document.getElementById('messagesContainer');
            const loadingId = 'loading-indicator';
            
            if (show) {
                const loadingDiv = document.createElement('div');
                loadingDiv.id = loadingId;
                loadingDiv.className = 'loading';
                loadingDiv.innerHTML = '<div class="spinner"></div>';
                container.appendChild(loadingDiv);
                container.scrollTop = container.scrollHeight;
            } else {
                const loading = document.getElementById(loadingId);
                if (loading) loading.remove();
            }
        }
        
        // 更新效能指標
        function updateMetrics(metrics) {
            state.metrics = metrics;
            
            // 更新信任度
            document.getElementById('trustValue').textContent = metrics.trust;
            document.getElementById('trustBar').style.width = `${metrics.trust * 10}%`;
            
            // 更新興趣度
            document.getElementById('interestValue').textContent = metrics.interest;
            document.getElementById('interestBar').style.width = `${metrics.interest * 10}%`;
            
            // 更新對話輪數
            document.getElementById('turnCount').textContent = metrics.turnCount;
        }
        
        // 顯示狀態變化
        function showStateChange(stateChange) {
            document.getElementById('customerState').textContent = `狀態：${stateChange}`;
            
            const toast = document.getElementById('stateChangeToast');
            toast.textContent = `客戶狀態變化：${stateChange}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // 結束會話
        function endSession() {
            if (!confirm('確定要結束這次訓練嗎？')) return;
            
            state.sessionActive = false;
            
            // 通知後端
            if (window.DonnaAI) {
                window.DonnaAI.sendMessage('roleplay', {
                    action: 'endSession'
                });
            }
            
            // 返回選擇頁面
            showPage('personaSelectionPage');
            
            // 清空對話
            document.getElementById('messagesContainer').innerHTML = '';
        }
        
        // 處理 Native Bridge 回調
        window.addEventListener('message', (event) => {
            try {
                const message = JSON.parse(event.data);
                if (message.type === 'roleplayCallback' && message.callbackId) {
                    const callback = state.pendingCallbacks.get(message.callbackId);
                    if (callback) {
                        callback(message.data);
                        state.pendingCallbacks.delete(message.callbackId);
                    }
                }
            } catch (error) {
                console.error('處理回調錯誤:', error);
            }
        });
        
        // 自動調整輸入框高度
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
        
        // Enter 發送訊息（Shift+Enter 換行）
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
