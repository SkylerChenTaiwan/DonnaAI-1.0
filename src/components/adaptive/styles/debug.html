<!DOCTYPE html>
<html>
<head>
    <title>StylePriorityManager Debug</title>
    <script>
        // 模擬 StylePriorityManager 的優先級合併
        const StylePriority = {
            DEFAULT: 1,
            SIZE_PRESET: 11,
            USER_STYLE: 21,
            PLATFORM_STYLE: 31,
            CONTENT_STYLE: 41
        };

        function testModalStyles() {
            const configs = [
                {
                    priority: StylePriority.DEFAULT,
                    style: {
                        backgroundColor: '#FFFFFF',
                        borderRadius: '8px',
                        display: 'flex',
                        flexDirection: 'column',
                        maxHeight: '95vh',
                        overflow: 'hidden',
                        position: 'relative'
                    }
                },
                {
                    priority: StylePriority.SIZE_PRESET,
                    style: {
                        width: '95vw',
                        height: '95vh',
                        maxWidth: '95vw',
                        maxHeight: '95vh',
                        minHeight: '90vh'
                    }
                },
                {
                    priority: StylePriority.CONTENT_STYLE,
                    style: {
                        width: '100%',
                        height: '100%'
                    }
                }
            ];

            // 按優先級排序並合併
            const sorted = configs.sort((a, b) => a.priority - b.priority);
            const merged = {};
            
            sorted.forEach(config => {
                Object.assign(merged, config.style);
            });

            console.log('最終樣式:', merged);
            console.log('期望結果: width=100%, height=100% (因為 CONTENT_STYLE 優先級最高)');
            
            // 顯示在頁面上
            document.getElementById('result').innerHTML = `
                <h3>樣式合併結果</h3>
                <pre>${JSON.stringify(merged, null, 2)}</pre>
                <h3>問題分析</h3>
                <p>contentStyle 的 100% 覆蓋了 SIZE_PRESET 的 95vw/95vh</p>
                <p>這導致 modal 變成了父容器的 100% 而不是視窗的 95%</p>
            `;
        }
    </script>
</head>
<body onload="testModalStyles()">
    <h1>StylePriorityManager 除錯頁面</h1>
    <div id="result"></div>
</body>
</html>
